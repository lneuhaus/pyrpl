name: Hardware CI

concurrency:
  group: redpitaya-hardware
  cancel-in-progress: false

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  # The RedPitaya is not always connected. On push / pull_request, an offline
  # board skips the hardware tests instead of failing them; run the workflow
  # manually (workflow_dispatch) once the board is back. A manual run with an
  # offline board fails, since the tests were explicitly requested.
  check-board:
    name: Check RedPitaya availability
    runs-on: [self-hosted]
    timeout-minutes: 5
    outputs:
      available: ${{ steps.probe.outputs.available }}
    env:
      REDPITAYA_HOSTNAME: ${{ secrets.REDPITAYA_PUBLIC_IP }}
      REDPITAYA_SSHPORT: ${{ secrets.REDPITAYA_SSH_PORT }}
    steps:
    - name: Probe RedPitaya SSH endpoint
      id: probe
      shell: bash
      run: |
        available=false
        if [ -z "$REDPITAYA_HOSTNAME" ] || [ -z "$REDPITAYA_SSHPORT" ]; then
          # e.g. Dependabot or fork pull requests, which get no repository secrets
          reason="RedPitaya secrets are not available to this run"
        else
          reason="RedPitaya SSH endpoint did not answer"
          for attempt in 1 2 3; do
            # Expect an SSH banner, not just an open TCP port.
            banner=$(timeout 10 bash -c \
              'exec 3<>/dev/tcp/$REDPITAYA_HOSTNAME/$REDPITAYA_SSHPORT && head -c 4 <&3' \
              2>/dev/null || true)
            if [ "$banner" = "SSH-" ]; then
              available=true
              break
            fi
            echo "Attempt $attempt/3: board not reachable"
            [ $attempt -lt 3 ] && sleep 10
          done
        fi
        echo "available=$available" >> "$GITHUB_OUTPUT"

        if [ "$available" = true ]; then
          echo "RedPitaya is reachable"
        elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
          echo "::error::$reason. Connect the board and run the workflow again."
          exit 1
        else
          echo "::warning::$reason. Hardware tests skipped; run the 'Hardware CI' workflow manually once the board is connected."
          echo "### Hardware tests skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "$reason. Run this workflow manually (Actions → Hardware CI → Run workflow) once the board is connected." >> "$GITHUB_STEP_SUMMARY"
        fi

  # Hardware-in-the-loop tests against the real RedPitaya, run on the
  # self-hosted Oracle runner so its IP can stay allowlisted on the Freebox
  # (GitHub-hosted runners have rotating IPs and can't be pinned like this).
  test:
    name: Hardware tests (Python ${{ matrix.python-version }})
    needs: check-board
    if: needs.check-board.outputs.available == 'true'
    runs-on: [self-hosted]
    # A degraded remote hardware connection must not monopolize the only
    # physical Red Pitaya runner indefinitely. Normal runs take about 7 min.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # PyRPL maps constructor arguments directly to REDPITAYA_<NAME>:
      # sshport -> REDPITAYA_SSHPORT, port -> REDPITAYA_PORT.
      REDPITAYA_HOSTNAME: ${{ secrets.REDPITAYA_PUBLIC_IP }}
      REDPITAYA_SSHPORT: ${{ secrets.REDPITAYA_SSH_PORT }}
      REDPITAYA_PORT: ${{ secrets.REDPITAYA_MONITOR_PORT }}
      REDPITAYA_USER: ${{ secrets.REDPITAYA_USER }}
      REDPITAYA_PASSWORD: ${{ secrets.REDPITAYA_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      max-parallel: 1   # only one job talks to the physical RP at a time

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "0.10.11"
        # The self-hosted runner retains uv's local cache between jobs.
        enable-cache: false

    - name: Set up display
      run: |
        export DISPLAY=:99
        sudo Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qtbase5-dev qt5-qmake

    - name: Install Python dependencies
      run: uv sync --locked --python ${{ matrix.python-version }} --extra test --extra qt-pyqt5

    - name: Register Jupyter kernel
      run: uv run --no-sync python -m ipykernel install --sys-prefix --name python3

    - name: Test RedPitaya connection
      shell: bash
      run: |
        uv run --no-sync python - <<'PY'
        import os
        import paramiko
        import socket
        import sys

        hostname = os.environ["REDPITAYA_HOSTNAME"]
        sshport = int(os.environ["REDPITAYA_SSHPORT"])

        try:
            # Test the forwarded TCP endpoint separately so a routing/firewall
            # failure is distinguishable from SSH authentication failure.
            with socket.create_connection((hostname, sshport), timeout=10):
                print("RedPitaya SSH TCP endpoint is reachable")

            ssh = paramiko.SSHClient()
            ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
            ssh.connect(
                hostname,
                port=sshport,
                username=os.environ["REDPITAYA_USER"],
                password=os.environ["REDPITAYA_PASSWORD"],
                timeout=10,
                banner_timeout=30,
                auth_timeout=30,
            )
            _stdin, stdout, _stderr = ssh.exec_command(
                "echo RedPitaya connected successfully"
            )
            print(stdout.read().decode().strip())
            ssh.close()
            print("RedPitaya connection test passed")
        except (OSError, paramiko.SSHException) as error:
            print(f"RedPitaya connection failed: {type(error).__name__}: {error}")
            sys.exit(1)
        PY

    - name: Run tests with retries
      shell: bash
      run: |
        # use a custom global configfile adapted to the hardware for unit tests
        # Connection parameters come from the test job's REDPITAYA_* variables.
        cp ./remote_global_config.yml ./pyrpl/config/global_config.yml
        echo "==========================================="
        echo "Running full test suite (attempt 1/3)"
        echo "==========================================="
        if uv run --no-sync python -m pytest pyrpl/test/ --cov=pyrpl --cov-report=xml; then
          echo "All tests passed!"
          exit 0
        fi

        echo ""
        echo "==========================================="
        echo "Re-running failed tests (attempt 2/3)"
        echo "==========================================="
        if uv run --no-sync python -m pytest pyrpl/test/ --lf --cov=pyrpl --cov-report=xml --cov-append; then
          echo "All previously failed tests passed!"
          exit 0
        fi

        echo ""
        echo "==========================================="
        echo "Final retry (attempt 3/3)"
        echo "==========================================="
        uv run --no-sync python -m pytest pyrpl/test/ --lf --cov=pyrpl --cov-report=xml --cov-append

      env:
        QT_QPA_PLATFORM: offscreen

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.14'
      uses: codecov/codecov-action@v6
      with:
        files: ./coverage.xml
        use_oidc: true

  # Notification job
  notify:
    runs-on: ubuntu-latest
    needs: [check-board, test]
    if: always()

    steps:
    - name: Notify on success
      if: ${{ needs.test.result == 'success' }}
      run: echo "All hardware test jobs completed successfully!"

    - name: Notify on skip
      if: ${{ needs.check-board.result == 'success' && needs.test.result == 'skipped' }}
      run: echo "RedPitaya offline, hardware tests skipped. Run this workflow manually once it is connected."

    - name: Notify on failure
      if: ${{ needs.test.result != 'success' && !(needs.check-board.result == 'success' && needs.test.result == 'skipped') }}
      run: |
        echo "Some hardware test jobs failed or were cancelled"
        exit 1
