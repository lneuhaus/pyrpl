name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  # Tests that do not need a Red Pitaya, on every supported Python version.
  # Tests marked "hardware" (those using the hardware_session fixture) are
  # skipped, except those also marked "simulation", which run against the
  # simulated _FAKE_ Red Pitaya (REDPITAYA_HOSTNAME is not set here).
  unit:
    name: Tests without hardware (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "0.10.11"
        enable-cache: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: Install Python dependencies
      run: uv sync --locked --python ${{ matrix.python-version }} --extra test --extra qt-pyqt5

    - name: Register Jupyter kernel
      run: uv run --no-sync python -m ipykernel install --sys-prefix --name python3

    - name: Run tests
      run: >
        xvfb-run -a uv run --no-sync python -m pytest pyrpl/test/
        -m "not hardware or simulation" --timeout=300
        --cov=pyrpl --cov-report=xml
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.13'
      uses: codecov/codecov-action@v6
      with:
        files: ./coverage.xml
        flags: unit
        use_oidc: true

  # The RedPitaya is not always connected. On push / pull_request, an offline
  # board skips the hardware tests instead of failing them; run the workflow
  # manually (workflow_dispatch) once the board is back. A manual run with an
  # offline board fails, since the tests were explicitly requested.
  check-board:
    name: Check RedPitaya availability
    runs-on: [self-hosted]
    timeout-minutes: 5
    outputs:
      available: ${{ steps.probe.outputs.available }}
    env:
      REDPITAYA_HOSTNAME: ${{ secrets.REDPITAYA_PUBLIC_IP }}
      REDPITAYA_SSHPORT: ${{ secrets.REDPITAYA_SSH_PORT }}
    steps:
    - name: Probe RedPitaya SSH endpoint
      id: probe
      shell: bash
      run: |
        available=false
        if [ -z "$REDPITAYA_HOSTNAME" ] || [ -z "$REDPITAYA_SSHPORT" ]; then
          # e.g. Dependabot or fork pull requests, which get no repository secrets
          reason="RedPitaya secrets are not available to this run"
        else
          reason="RedPitaya SSH endpoint did not answer"
          for attempt in 1 2 3; do
            # Expect an SSH banner, not just an open TCP port.
            banner=$(timeout 10 bash -c \
              'exec 3<>/dev/tcp/$REDPITAYA_HOSTNAME/$REDPITAYA_SSHPORT && head -c 4 <&3' \
              2>/dev/null || true)
            if [ "$banner" = "SSH-" ]; then
              available=true
              break
            fi
            echo "Attempt $attempt/3: board not reachable"
            [ $attempt -lt 3 ] && sleep 10
          done
        fi
        echo "available=$available" >> "$GITHUB_OUTPUT"

        if [ "$available" = true ]; then
          echo "RedPitaya is reachable"
        elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
          echo "::error::$reason. Connect the board and run the workflow again."
          exit 1
        else
          echo "::warning::$reason. Hardware tests skipped; run the 'CI' workflow manually once the board is connected."
          echo "### Hardware tests skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "$reason. Run this workflow manually (Actions → CI → Run workflow) once the board is connected." >> "$GITHUB_STEP_SUMMARY"
        fi

  # Hardware-in-the-loop tests against the real RedPitaya, run on the
  # self-hosted Oracle runner so its IP can stay allowlisted on the Freebox
  # (GitHub-hosted runners have rotating IPs and can't be pinned like this).
  hardware:
    name: Hardware tests (Python ${{ matrix.python-version }})
    needs: check-board
    if: needs.check-board.outputs.available == 'true'
    runs-on: [self-hosted]
    # only one job talks to the physical Red Pitaya at a time
    concurrency:
      group: redpitaya-hardware
      cancel-in-progress: false
    strategy:
      matrix:
        # The hardware tests run on a single Python version: the other
        # versions are covered by the unit job.
        python-version: ['3.13']
    # A degraded remote hardware connection must not monopolize the only
    # physical Red Pitaya runner indefinitely. Normal runs take about 7 min.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # PyRPL maps constructor arguments directly to REDPITAYA_<NAME>:
      # sshport -> REDPITAYA_SSHPORT, port -> REDPITAYA_PORT.
      REDPITAYA_HOSTNAME: ${{ secrets.REDPITAYA_PUBLIC_IP }}
      REDPITAYA_SSHPORT: ${{ secrets.REDPITAYA_SSH_PORT }}
      REDPITAYA_PORT: ${{ secrets.REDPITAYA_MONITOR_PORT }}
      REDPITAYA_USER: ${{ secrets.REDPITAYA_USER }}
      REDPITAYA_PASSWORD: ${{ secrets.REDPITAYA_PASSWORD }}
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "0.10.11"
        # The self-hosted runner retains uv's local cache between jobs.
        enable-cache: false

    # Qt runs with QT_QPA_PLATFORM=offscreen: no X server is needed (the
    # former Xvfb step was never used and left a root process behind).
    - name: Stop processes left by an interrupted job
      shell: bash
      run: |
        sudo pkill -x Xvfb || true
        pkill -f "python -m pytest pyrpl/test" || true

    # The runner keeps ~/pyrpl_user_dir between jobs: the curves saved by
    # every run accumulated there and slowed the GUI tests down run after run.
    # RUNNER_TEMP is emptied after each job.
    - name: Use a fresh PyRPL user directory
      shell: bash
      run: echo "PYRPL_USER_DIR=$RUNNER_TEMP/pyrpl_user_dir" >> "$GITHUB_ENV"

    # Curves saved in the default user directory by earlier runs, or by
    # anything run on the runner outside of this workflow
    - name: Remove curves left on the runner
      shell: bash
      run: |
        dir="$HOME/pyrpl_user_dir/curve"
        if [ -d "$dir" ]; then
          echo "$(find "$dir" -name '*.dat' | wc -l) curves ($(du -sh "$dir" | cut -f1)) in $dir"
          find "$dir" -name '*.dat' -delete
        fi

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qtbase5-dev qt5-qmake

    - name: Install Python dependencies
      run: uv sync --locked --python ${{ matrix.python-version }} --extra test --extra qt-pyqt5

    - name: Register Jupyter kernel
      run: uv run --no-sync python -m ipykernel install --sys-prefix --name python3

    - name: Test RedPitaya connection
      shell: bash
      run: |
        uv run --no-sync python - <<'PY'
        import os
        import paramiko
        import socket
        import sys

        hostname = os.environ["REDPITAYA_HOSTNAME"]
        sshport = int(os.environ["REDPITAYA_SSHPORT"])

        try:
            # Test the forwarded TCP endpoint separately so a routing/firewall
            # failure is distinguishable from SSH authentication failure.
            with socket.create_connection((hostname, sshport), timeout=10):
                print("RedPitaya SSH TCP endpoint is reachable")

            ssh = paramiko.SSHClient()
            ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
            ssh.connect(
                hostname,
                port=sshport,
                username=os.environ["REDPITAYA_USER"],
                password=os.environ["REDPITAYA_PASSWORD"],
                timeout=10,
                banner_timeout=30,
                auth_timeout=30,
            )
            _stdin, stdout, _stderr = ssh.exec_command(
                "echo RedPitaya connected successfully"
            )
            print(stdout.read().decode().strip())
            ssh.close()
            print("RedPitaya connection test passed")
        except (OSError, paramiko.SSHException) as error:
            print(f"RedPitaya connection failed: {type(error).__name__}: {error}")
            sys.exit(1)
        PY

    - name: Run tests with retries
      shell: bash
      # below the job timeout, so that the cleanup steps still run after a hang
      timeout-minutes: 22
      run: |
        # use a custom global configfile adapted to the hardware for unit tests
        # Connection parameters come from the test job's REDPITAYA_* variables.
        cp ./remote_global_config.yml ./pyrpl/config/global_config.yml
        echo "==========================================="
        echo "Running full test suite (attempt 1/3)"
        echo "==========================================="
        if uv run --no-sync python -m pytest pyrpl/test/ -m hardware --timeout=600 --cov=pyrpl --cov-report=xml; then
          echo "All tests passed!"
          exit 0
        fi

        echo ""
        echo "==========================================="
        echo "Re-running failed tests (attempt 2/3)"
        echo "==========================================="
        if uv run --no-sync python -m pytest pyrpl/test/ -m hardware --timeout=600 --lf --cov=pyrpl --cov-report=xml --cov-append; then
          echo "All previously failed tests passed!"
          exit 0
        fi

        echo ""
        echo "==========================================="
        echo "Final retry (attempt 3/3)"
        echo "==========================================="
        uv run --no-sync python -m pytest pyrpl/test/ -m hardware --timeout=600 --lf --cov=pyrpl --cov-report=xml --cov-append

      env:
        QT_QPA_PLATFORM: offscreen

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        files: ./coverage.xml
        flags: hardware
        use_oidc: true

    - name: Stop test processes
      if: always()
      shell: bash
      run: pkill -f "python -m pytest pyrpl/test" || true

  # Notification job
  notify:
    runs-on: ubuntu-latest
    needs: [unit, check-board, hardware]
    if: always()

    steps:
    - name: Notify on success
      if: ${{ needs.unit.result == 'success' && needs.hardware.result == 'success' }}
      run: echo "All test jobs completed successfully!"

    - name: Notify on skip
      if: ${{ needs.unit.result == 'success' && needs.check-board.result == 'success' && needs.hardware.result == 'skipped' }}
      run: echo "Tests without hardware passed. RedPitaya offline, hardware tests skipped. Run this workflow manually once it is connected."

    - name: Notify on failure
      if: ${{ needs.unit.result != 'success' || (needs.hardware.result != 'success' && !(needs.check-board.result == 'success' && needs.hardware.result == 'skipped')) }}
      run: |
        echo "Some test jobs failed or were cancelled"
        exit 1
