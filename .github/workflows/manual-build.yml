name: Manual Binary Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref to build (branch, tag, or commit SHA)"
        required: true
        default: "main"

      release_tag:
        description: "Existing version tag used when publishing (for example 0.9.9.0)"
        required: false
        default: ""

      build_linux:
        description: "Build Linux binary"
        type: boolean
        default: true

      build_macos:
        description: "Build separate macOS Intel and Apple Silicon binaries"
        type: boolean
        default: true

      build_windows:
        description: "Build Windows binary"
        type: boolean
        default: true

      publish_release:
        description: "Publish binaries to GitHub Release"
        type: boolean
        default: false

concurrency:
  group: manual-build
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  build-linux:
    if: inputs.build_linux
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.source_ref }}

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "0.10.11"

    - name: Read package version
      shell: bash
      run: |
        version=$(python -c "import runpy; print(runpy.run_path('pyrpl/_version.py')['__version__'])")
        echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qtbase5-dev qt5-qmake

    - name: Install Python dependencies
      run: uv sync --locked --python ${{ env.PYTHON_VERSION }} --extra dev --extra qt-pyqt5

    - name: Build Linux binary
      run: |
        uv run --no-sync pyinstaller pyrpl.spec
        # A healthy GUI remains alive in the Qt event loop. Fail when the
        # frozen application exits during startup due to a packaging error.
        ./dist/pyrpl/pyrpl config=build_smoke_test hostname=_FAKE_ &
        app_pid=$!
        sleep 15
        if ! kill -0 "$app_pid" 2>/dev/null; then
          wait "$app_pid"
          echo "Frozen Linux application exited during startup."
          exit 1
        fi
        kill "$app_pid"
        wait "$app_pid" 2>/dev/null || true

        # PyInstaller creates a directory, so we need to archive it
        cd dist
        mv pyrpl "pyrpl-${PACKAGE_VERSION}-linux-x86_64"
        tar -czf "pyrpl-${PACKAGE_VERSION}-linux-x86_64.tar.gz" "pyrpl-${PACKAGE_VERSION}-linux-x86_64"
        cd ..
      env:
        QT_QPA_PLATFORM: offscreen

    - uses: actions/upload-artifact@v6
      with:
        name: pyrpl-linux
        path: dist/pyrpl-*-linux-x86_64.tar.gz

  build-macos:
    if: inputs.build_macos
    strategy:
      matrix:
        arch:
          - name: arm64
            runner: macos-14
          - name: x86_64
            runner: macos-15-intel

    runs-on: ${{ matrix.arch.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.11"

      - name: Read package version
        shell: bash
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('pyrpl/_version.py')['__version__'])")
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --locked --python ${{ env.PYTHON_VERSION }} --extra dev --extra qt-pyqt5

      - name: Build pyrpl (macOS ${{ matrix.arch.name }})
        run: |
          uv run --no-sync pyinstaller pyrpl.spec
          # Create a zip archive of the directory
          cd dist
          mv pyrpl "pyrpl-${PACKAGE_VERSION}-macos-${{ matrix.arch.name }}"
          zip -r "pyrpl-${PACKAGE_VERSION}-macos-${{ matrix.arch.name }}.zip" "pyrpl-${PACKAGE_VERSION}-macos-${{ matrix.arch.name }}"
          cd ..

      - name: Verify build
        run: |
          file dist/pyrpl-${PACKAGE_VERSION}-macos-${{ matrix.arch.name }}/pyrpl
          dist/pyrpl-${PACKAGE_VERSION}-macos-${{ matrix.arch.name }}/pyrpl \
            config=build_smoke_test hostname=_FAKE_ &
          app_pid=$!
          sleep 15
          if ! kill -0 "$app_pid" 2>/dev/null; then
            wait "$app_pid"
            echo "Frozen macOS application exited during startup."
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" 2>/dev/null || true
        env:
          QT_QPA_PLATFORM: offscreen
          
      - uses: actions/upload-artifact@v6
        with:
            name: pyrpl-macos-${{ matrix.arch.name }}
            path: dist/pyrpl-*-macos-${{ matrix.arch.name }}.zip

  build-windows:
    if: inputs.build_windows
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.source_ref }}

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "0.10.11"

    - name: Read package version
      shell: powershell
      run: |
        $version = python -c "import runpy; print(runpy.run_path('pyrpl/_version.py')['__version__'])"
        "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install Python dependencies
      run: |
        uv sync --locked --python ${{ env.PYTHON_VERSION }} --extra dev
        # PyQt5-Qt5 releases after 5.15.2 do not provide Windows wheels.
        uv pip install --python .venv "PyQt5" "PyQt5-Qt5==5.15.2"

    - name: Build Windows binary
      run: |
        # Clean any previous builds
        if (Test-Path "build") { Remove-Item -Recurse -Force build }
        if (Test-Path "dist") { Remove-Item -Recurse -Force dist }
        
        # Build with verbose output
        uv run --no-sync pyinstaller --clean pyrpl.spec

        # Start the frozen application with fake hardware. A healthy GUI stays
        # alive in the Qt event loop; an import/packaging error exits early.
        $executable = if (Test-Path "dist\pyrpl\pyrpl.exe") {
          "dist\pyrpl\pyrpl.exe"
        } elseif (Test-Path "dist\pyrpl.exe") {
          "dist\pyrpl.exe"
        } else {
          Write-Error "PyInstaller did not create pyrpl.exe"
          exit 1
        }
        $process = Start-Process -FilePath $executable `
          -ArgumentList "config=build_smoke_test", "hostname=_FAKE_" `
          -PassThru -NoNewWindow
        if ($process.WaitForExit(15000)) {
          Write-Error "Frozen Windows application exited during startup with code $($process.ExitCode)"
          exit 1
        }
        Stop-Process -Id $process.Id -Force
        
        # Debug: List what's in dist
        Write-Host "`nContents of dist directory:"
        Get-ChildItem -Path dist -Force | Format-Table Name, Length, Mode
        
        Write-Host "`nFull directory structure:"
        Get-ChildItem -Path dist -Recurse -Force | Select-Object FullName
        
        # Check if it's a directory or single file
        if (Test-Path "dist\pyrpl" -PathType Container) {
          Write-Host "`nFound pyrpl directory, creating zip..."
          $archiveRoot = "dist\pyrpl-$env:PACKAGE_VERSION-windows-x86_64"
          Move-Item -Path "dist\pyrpl" -Destination $archiveRoot
          Compress-Archive -Path $archiveRoot -DestinationPath "dist\pyrpl-$env:PACKAGE_VERSION-windows-x86_64.zip"
        } elseif (Test-Path "dist\pyrpl.exe" -PathType Leaf) {
          Write-Host "`nWARNING: Found single pyrpl.exe file instead of directory!"
          Write-Host "The spec file should create a directory, but PyInstaller created a single file."
          Write-Host "Creating zip of single exe file..."
          Move-Item -Path "dist\pyrpl.exe" -Destination "dist\pyrpl-$env:PACKAGE_VERSION-windows-x86_64.exe"
          Compress-Archive -Path "dist\pyrpl-$env:PACKAGE_VERSION-windows-x86_64.exe" -DestinationPath "dist\pyrpl-$env:PACKAGE_VERSION-windows-x86_64.zip"
        } else {
          Write-Host "`nERROR: Could not find dist\pyrpl or dist\pyrpl.exe"
          exit 1
        }
      env:
        QT_QPA_PLATFORM_PLUGIN_PATH: ${{ github.workspace }}\.venv\Lib\site-packages\PyQt5\Qt5\plugins\platforms

    - uses: actions/upload-artifact@v6
      with:
        name: pyrpl-windows
        path: dist/pyrpl-*-windows-x86_64.zip

  publish-release:
    if: always() && inputs.publish_release && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check out requested source with tags
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.source_ref }}
        fetch-depth: 0

    - name: Validate release tag
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        if [[ -z "$RELEASE_TAG" ]]; then
          echo "release_tag is required when publish_release is enabled."
          exit 1
        fi
        if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
          echo "Invalid release tag '$RELEASE_TAG'; expected a version such as 0.9.9.0."
          exit 1
        fi
        if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
          echo "Tag '$RELEASE_TAG' does not exist. Create and push it before running this workflow."
          exit 1
        fi
        tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
        source_commit=$(git rev-parse HEAD)
        if [[ "$tag_commit" != "$source_commit" ]]; then
          echo "Tag '$RELEASE_TAG' points to $tag_commit, but source_ref points to $source_commit."
          exit 1
        fi
        package_version=$(python -c "import runpy; print(runpy.run_path('pyrpl/_version.py')['__version__'])")
        tag_version=${RELEASE_TAG#v}
        if [[ "$tag_version" != "$package_version" ]]; then
          echo "Tag '$RELEASE_TAG' does not match package version '$package_version'."
          exit 1
        fi

    - name: Download artifacts
      uses: actions/download-artifact@v6
      with:
        path: release-assets

    - name: Create GitHub Release if needed
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release create "$RELEASE_TAG" --verify-tag --title "PyRPL $RELEASE_TAG" --generate-notes
        fi

    - name: Upload binaries with versioned filenames
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        mapfile -t assets < <(find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' \))
        if [[ ${#assets[@]} -eq 0 ]]; then
          echo "No binary assets were downloaded."
          exit 1
        fi
        gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  publish-pypi:
    if: inputs.publish_release
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the trusted PyPI publishing workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh workflow run publish-pypi.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field release_tag="$RELEASE_TAG"
